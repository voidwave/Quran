<!DOCTYPE html>
<html dir="rtl" lang="ar">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0f10">
    <title>المصحف — صفحات القرآن الكريم</title>
    <script>
        // Apply the saved colour scheme before the first paint to avoid a flash.
        (function () {
            var theme = 'dark';
            try {
                theme = localStorage.getItem('quran-theme')
                    || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            } catch (error) {
                theme = 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <style>
        /* ------------------------------------------------------------------
           Mushaf page test (index2.html)

           Every printed word is one glyph of the page font (p<page>.woff2),
           laid out on the 15 printed lines so the text breaks exactly like the
           Mushaf page. The real ʿUthmānī words sit behind the glyphs, so the
           text can still be selected, searched and copied.
        ------------------------------------------------------------------ */
        @font-face {
            font-family: 'Uthmanic';
            src: url('fonts/uthmanic_hafs_v22.ttf') format('truetype');
            font-display: swap;
        }

        :root {
            color-scheme: dark;
            --bg: #0a0f10;
            --surface: #111a1b;
            --surface-2: #16211f;
            --surface-3: #1e2b29;
            --border: rgba(255, 255, 255, 0.08);
            --text: #edf3f1;
            --text-dim: #b4c1bd;
            --muted: #8b9a96;
            --accent: #e2be6a;
            --accent-soft: rgba(226, 190, 106, 0.14);
            --on-accent: #1b1508;
            --appbar: rgba(10, 15, 16, 0.86);
            --paper: #f8f3e6;
            --paper-ink: #1c1a14;
            --font-ui: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            --font-ar: "Noto Naskh Arabic", "Segoe UI", Tahoma, serif;

            /* Size of one glyph, written by index2.js once the pages are set. */
            --fs: 34px;
            --lh: 60px;
            /* Height of the app bar, written by index2.js; pages scroll under it. */
            --appbar-h: 64px;
        }

        :root[data-theme="light"] {
            color-scheme: light;
            --bg: #f7f5ef;
            --appbar: rgba(250, 248, 243, 0.9);
            --surface: #ffffff;
            --surface-2: #f4f1e9;
            --surface-3: #eae5d9;
            --border: rgba(23, 43, 38, 0.12);
            --text: #17211f;
            --text-dim: #46544f;
            --muted: #6d7b76;
            --accent: #96701d;
            --accent-soft: rgba(150, 112, 28, 0.12);
            --on-accent: #fffaf0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(900px 600px at 75% -15%, #15231f, transparent), var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            -webkit-text-size-adjust: 100%;
        }

        [hidden] {
            display: none !important;
        }

        /* ------------------------------------------------------------------
           App bar (the same pieces as index.html)
        ------------------------------------------------------------------ */
        .appbar {
            position: sticky;
            z-index: 30;
            top: 0;
            padding-top: env(safe-area-inset-top);
            background: var(--appbar);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }

        .appbar__inner {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            width: min(100% - 24px, 1180px);
            margin: 0 auto;
            padding: 10px 0;
        }

        .appbar__tools {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            margin-inline-start: auto;
        }

        .btn {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 8px 13px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            font: inherit;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
        }

        .btn:hover {
            border-color: rgba(226, 190, 106, 0.5);
            color: var(--accent);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
        }

        .btn--primary {
            background: var(--accent);
            border-color: transparent;
            color: var(--on-accent);
            font-weight: 600;
        }

        .btn--primary:hover {
            color: var(--on-accent);
            filter: brightness(1.06);
        }

        .pager {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .pager .btn {
            padding: 8px 10px;
        }

        .chip {
            min-width: 62px;
            text-align: center;
            background: var(--accent-soft);
            border: 1px solid rgba(226, 190, 106, 0.35);
            color: var(--accent);
            border-radius: 999px;
            padding: 8px 12px;
            font-family: 'Uthmanic', var(--font-ar);
            font-size: 17px;
            line-height: 1.4;
        }

        /* ------------------------------------------------------------------
           Surah picker
        ------------------------------------------------------------------ */
        .picker {
            position: relative;
        }

        .picker__panel {
            position: absolute;
            z-index: 40;
            top: calc(100% + 8px);
            inset-inline-start: 0;
            width: min(330px, calc(100vw - 32px));
            max-height: min(64vh, 520px);
            overflow: auto;
            padding: 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
        }

        .picker__filter {
            width: 100%;
            height: 40px;
            margin-bottom: 6px;
            padding: 0 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--surface-2);
            color: var(--text);
            font-family: var(--font-ar);
            font-size: 15px;
        }

        .picker__filter:focus {
            outline: none;
            border-color: var(--accent);
        }

        .surah-item {
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            padding: 8px 10px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 14px;
            text-align: start;
            cursor: pointer;
        }

        .surah-item:hover {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .surah-item__num {
            min-width: 30px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }

        .surah-item__name {
            flex: 1 1 auto;
            font-family: var(--font-ar);
            font-size: 15px;
        }

        .surah-item__page {
            color: var(--muted);
            font-size: 12px;
        }

        #theme-toggle .icon-sun {
            display: none;
        }

        :root[data-theme="light"] #theme-toggle .icon-sun {
            display: block;
        }

        :root[data-theme="light"] #theme-toggle .icon-moon {
            display: none;
        }

        /* ------------------------------------------------------------------
           The stacked pages
        ------------------------------------------------------------------ */
        #mushaf {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(14px, 2.4vw, 28px);
            padding: clamp(14px, 2.4vw, 28px) 12px 0;
        }

        /* One printed page; the slot keeps the page's height even while the page
           itself is not drawn, so the scrollbar (and the position) hold still. */
        .page-slot {
            display: flex;
            justify-content: center;
            width: 100%;
            scroll-margin-top: calc(var(--appbar-h) + 10px);
        }

        .foot {
            padding: 26px 16px 40px;
            color: var(--muted);
            font-size: 12px;
            line-height: 2;
            text-align: center;
        }

        /* ------------------------------------------------------------------
           The Mushaf page
        ------------------------------------------------------------------ */
        .page {
            width: min(100%, 820px);
            padding: clamp(14px, 2.4vw, 30px);
            background: linear-gradient(180deg, #fbf7ec, #f1e9d5);
            color: var(--paper-ink);
            border: 1px solid rgba(201, 162, 79, 0.45);
            border-radius: 14px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), inset 0 0 0 6px rgba(201, 162, 79, 0.10);
        }

        .page__lines {
            display: flex;
            flex-direction: column;
        }

        .line-row {
            display: flex;
            direction: rtl;
            justify-content: space-between;
            align-items: center;
            flex-wrap: nowrap;
            white-space: nowrap;
            /* The printed pages keep a fixed line pitch; without it the lines
               would collapse to the height of the glyphs. */
            height: var(--lh);
        }

        .word {
            font-family: var(--page-font, 'Uthmanic'), 'Uthmanic', serif;
            font-size: var(--fs);
            line-height: 1;
            padding: 0 0.04em;
            border-radius: 0.16em;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.15s ease;
        }

        .word:hover {
            background: rgba(201, 162, 79, 0.25);
        }

        .word.is-open {
            background: rgba(201, 162, 79, 0.42);
        }

        .word:focus-visible {
            outline: 2px solid rgba(160, 122, 40, 0.7);
            outline-offset: 1px;
        }

        .page__number {
            text-align: center;
            margin-top: 0.5em;
            font-family: 'Uthmanic', serif;
            font-size: calc(var(--fs) * 0.5);
            color: #7d6a35;
        }

        /* The decorated surah banner that opens a surah in the print. In the
           Mushaf it takes two of the 15 printed lines (the line numbers around
           it skip from 9 to 12 on page 293). */
        .banner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(var(--fs) * 0.06);
            min-height: calc(var(--lh) * 2);
            padding: calc(var(--fs) * 0.08) calc(var(--fs) * 0.5);
            border: 1.5px solid rgba(160, 122, 40, 0.5);
            border-radius: calc(var(--fs) * 0.3);
            background: linear-gradient(180deg, rgba(226, 190, 106, 0.2), rgba(226, 190, 106, 0.05));
        }

        /* The cartouche itself comes from a ligature font: "018" -> the
           decorated name of surah 18. Kept hidden until the font is ready. */
        .chapter-icon::before {
            content: attr(data-chapter-icon);
            font-family: 'surahnames';
            font-size: calc(var(--fs) * 1.15);
            line-height: 1;
            visibility: hidden;
        }

        html[data-surah-names-ready="true"] .chapter-icon::before {
            visibility: visible;
        }

        .banner__basmala {
            font-family: 'Uthmanic', serif;
            font-size: calc(var(--fs) * 0.62);
            color: #2b2413;
        }

        /* The real verse text, kept in the DOM for search engines and screen
           readers (the glyph layer alone would be meaningless text). */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip-path: inset(50%);
            white-space: nowrap;
        }

        /* ------------------------------------------------------------------
           Word popover + toast
        ------------------------------------------------------------------ */
        .popover {
            position: fixed;
            z-index: 50;
            width: min(330px, calc(100vw - 24px));
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
            padding: 14px 16px 12px;
        }

        .popover__word {
            font-family: 'Uthmanic', serif;
            font-size: 30px;
            line-height: 1.6;
            text-align: center;
            color: #f7f3e7;
        }

        .popover__translit {
            text-align: center;
            color: var(--accent);
            font-size: 14px;
        }

        .popover__translation {
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
            margin-top: 6px;
            direction: ltr;
        }

        .popover__foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .popover__loc {
            color: var(--muted);
            font-size: 12px;
        }

        .play-btn {
            background: var(--accent-soft);
            border: 1px solid rgba(226, 190, 106, 0.35);
            color: var(--accent);
            border-radius: 9px;
            padding: 6px 12px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }

        .play-btn:hover {
            border-color: rgba(226, 190, 106, 0.7);
        }

        .toast {
            position: fixed;
            inset-inline: 0;
            bottom: 18px;
            margin-inline: auto;
            width: fit-content;
            max-width: min(720px, calc(100vw - 24px));
            background: var(--surface-3);
            border: 1px solid rgba(226, 190, 106, 0.35);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 12px;
            box-shadow: 0 18px 42px rgba(0, 0, 0, 0.5);
            font-size: 14px;
            line-height: 1.9;
        }

        /* On small screens the labels go and the tools stay on one row. */
        @media (max-width: 700px) {
            .btn__label {
                display: none;
            }

            .btn--primary .btn__label {
                display: inline;
            }

            .appbar__tools {
                margin-inline-start: 0;
            }

            .chip {
                min-width: 54px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>
    <header class="appbar" id="appbar">
        <div class="appbar__inner">
            <div class="picker" id="surah-picker">
                <button id="surah-toggle" class="btn btn--primary" type="button" aria-label="قائمة السور"
                    aria-expanded="false" aria-controls="surah-panel" title="قائمة السور">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                    </svg>
                    <span class="btn__label">السور</span>
                </button>
                <div id="surah-panel" class="picker__panel" hidden>
                    <input id="surah-filter" class="picker__filter" type="search" placeholder="ابحث عن سورة…"
                        autocomplete="off" spellcheck="false" aria-label="ابحث عن سورة">
                    <div id="surah-list"></div>
                </div>
            </div>

            <div class="pager">
                <button id="prev-page" class="btn" type="button" aria-label="الصفحة السابقة" title="الصفحة السابقة">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="m9 6 6 6-6 6"></path>
                    </svg>
                </button>
                <span class="chip" id="page-chip">١</span>
                <button id="next-page" class="btn" type="button" aria-label="الصفحة التالية" title="الصفحة التالية">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="m15 6-6 6 6 6"></path>
                    </svg>
                </button>
            </div>

            <div class="appbar__tools">
                <button id="random-button" class="btn" type="button" aria-label="سورة عشوائية" title="سورة عشوائية">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M16 3h5v5"></path>
                        <path d="M4 20 21 3"></path>
                        <path d="M21 16v5h-5"></path>
                        <path d="m15 15 6 6"></path>
                        <path d="m4 4 5 5"></path>
                    </svg>
                    <span class="btn__label">سورة عشوائية</span>
                </button>
                <button id="theme-toggle" class="btn" type="button" aria-label="Switch to light mode"
                    title="تفعيل الوضع النهاري">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                    </svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path
                            d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M4.9 19.1l1.5-1.5M17.6 6.4l1.5-1.5">
                        </path>
                    </svg>
                    <span class="btn__label">الوضع</span>
                </button>
                <a class="btn" href="index.html" title="فتح قارئ القرآن">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        aria-hidden="true">
                        <path d="M4 6h16M4 12h16M4 18h10"></path>
                    </svg>
                    <span class="btn__label">القارئ</span>
                </a>
            </div>
        </div>
    </header>

    <main id="mushaf"></main>

    <footer class="foot">
        النص ورموز الرسم من <span dir="ltr">api.quran.com</span>، وخطوط صفحات المصحف لمجمع الملك فهد بن عبد العزيز
        (عبر <span dir="ltr">quran.com</span>) — للتجربة المحلية، راجع رخصة <span dir="ltr">qul.tarteel.ai</span> قبل
        النشر.
    </footer>

    <div class="popover" id="popover" hidden></div>
    <div class="toast" id="toast" role="status" hidden></div>

    <script src="index2.js"></script>
</body>

</html>
